name: meremedical

topology:
  nodes:
    client1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.10.1.2/24 dev eth1

    client2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.10.2.2/24 dev eth1

    medical-server:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.10.1.1/24 dev eth1
        - ip addr add 10.10.2.1/24 dev eth2

  links:
    - endpoints: ["client1:eth1", "medical-server:eth1"]
    - endpoints: ["client2:eth1", "medical-server:eth2"]
